# nginx in the frontend container: serves the built React app and forwards /api to the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to FastAPI. "backend" is the service name in compose.yaml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built JS/CSS files have a content hash in their name, so browsers may cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a page of the React app (e.g. /radar), so always answer with index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}