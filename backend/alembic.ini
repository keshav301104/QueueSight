# Alembic: versioned, reversible changes to QueueSight's database.
# Run from inside backend/, with DATABASE_URL set (the database address lives there, never in this file):
#   python -m alembic upgrade head      bring the database up to the latest version
#   python -m alembic downgrade -1      undo the last step
#   python -m alembic current           which version the database is at now
#   python -m alembic history           every step so far

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S