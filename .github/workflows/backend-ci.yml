# Backend CI: on every push and pull request to main, lint the Python code and run every test,
# including the database tests, against a real PostgreSQL + TimescaleDB (the same image as compose.yaml).
name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: queuesight
          POSTGRES_PASSWORD: queuesight
          POSTGRES_DB: queuesight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U queuesight -d queuesight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://queuesight:queuesight@localhost:5432/queuesight_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (the same version as the Docker image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check backend/

      - name: Run every test, with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term